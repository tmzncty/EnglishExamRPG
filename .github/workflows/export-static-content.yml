name: Export static content to text

on:
  push:
    paths:
      - "Project_Mia/backend/data/static_content.db"
      - "Project_Mia/backend/data_import/**"
      - "Project_Mia/backend/scripts/bootstrap_legacy_bundles.py"
      - "Project_Mia/backend/scripts/crosscheck_public_exam_sources.py"
      - "Project_Mia/backend/scripts/import_exam_bundle.py"
      - "Project_Mia/backend/scripts/repair_exam_content.py"
      - "Project_Mia/backend/scripts/repair_writing_samples.py"
      - "Project_Mia/backend/scripts/normalize_exam_storage.py"
      - "Project_Mia/backend/scripts/validate_exam_catalog.py"
      - "Project_Mia/backend/scripts/export_static_content_text.py"
      - "Project_Mia/backend/scripts/export_exam_images.py"
      - "Project_Mia/scripts/quality_check.py"
      - ".github/workflows/export-static-content.yml"
  pull_request:
    paths:
      - "Project_Mia/backend/data/static_content.db"
      - "Project_Mia/backend/data_import/**"
      - "Project_Mia/backend/scripts/bootstrap_legacy_bundles.py"
      - "Project_Mia/backend/scripts/crosscheck_public_exam_sources.py"
      - "Project_Mia/backend/scripts/import_exam_bundle.py"
      - "Project_Mia/backend/scripts/repair_exam_content.py"
      - "Project_Mia/backend/scripts/repair_writing_samples.py"
      - "Project_Mia/backend/scripts/normalize_exam_storage.py"
      - "Project_Mia/backend/scripts/validate_exam_catalog.py"
      - "Project_Mia/backend/scripts/export_static_content_text.py"
      - "Project_Mia/backend/scripts/export_exam_images.py"
      - "Project_Mia/scripts/quality_check.py"
      - ".github/workflows/export-static-content.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap missing legacy bundle review drafts
        run: python Project_Mia/backend/scripts/bootstrap_legacy_bundles.py

      - name: Import curated exam bundles
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(Project_Mia/backend/data_import/*.json)
          if (( ${#bundles[@]} == 0 )); then
            echo "No curated exam bundles found."
          else
            for bundle in "${bundles[@]}"; do
              python Project_Mia/backend/scripts/import_exam_bundle.py "${bundle}"
            done
          fi

      - name: Apply deterministic legacy repairs
        run: python Project_Mia/backend/scripts/repair_exam_content.py

      - name: Repair writing samples to exam length
        run: python Project_Mia/backend/scripts/repair_writing_samples.py

      - name: Normalize catalog storage and remove committed test fixtures
        run: python Project_Mia/backend/scripts/normalize_exam_storage.py

      - name: Validate English I catalog structure and answers
        run: python Project_Mia/backend/scripts/validate_exam_catalog.py

      - name: Run legacy answer completeness audit
        run: python Project_Mia/scripts/quality_check.py

      - name: Cross-check independent public transcriptions
        run: python Project_Mia/backend/scripts/crosscheck_public_exam_sources.py

      - name: Export SQLite content
        run: python Project_Mia/backend/scripts/export_static_content_text.py

      - name: Export question images into Markdown projection
        run: python Project_Mia/backend/scripts/export_exam_images.py

      - name: Commit database, generated projection, review drafts, and audit report
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Project_Mia/backend/data/static_content.db Project_Mia/backend/data_export Project_Mia/backend/data_import Project_Mia/backend/manual_review)" ]; then
            echo "Database, generated export, review drafts, and audit report are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project_Mia/backend/data/static_content.db Project_Mia/backend/data_export Project_Mia/backend/data_import Project_Mia/backend/manual_review
          git commit -m "Refresh manual corpus crosscheck report"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
