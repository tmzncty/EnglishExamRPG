name: Export static content to text

on:
  push:
    paths:
      - "Project_Mia/backend/data/static_content.db"
      - "Project_Mia/backend/data_import/**"
      - "Project_Mia/backend/scripts/import_exam_bundle.py"
      - "Project_Mia/backend/scripts/repair_exam_content.py"
      - "Project_Mia/backend/scripts/normalize_exam_storage.py"
      - "Project_Mia/backend/scripts/validate_exam_catalog.py"
      - "Project_Mia/backend/scripts/export_static_content_text.py"
      - "Project_Mia/backend/scripts/export_exam_images.py"
      - "Project_Mia/scripts/quality_check.py"
      - ".github/workflows/export-static-content.yml"
  pull_request:
    paths:
      - "Project_Mia/backend/data/static_content.db"
      - "Project_Mia/backend/data_import/**"
      - "Project_Mia/backend/scripts/import_exam_bundle.py"
      - "Project_Mia/backend/scripts/repair_exam_content.py"
      - "Project_Mia/backend/scripts/normalize_exam_storage.py"
      - "Project_Mia/backend/scripts/validate_exam_catalog.py"
      - "Project_Mia/backend/scripts/export_static_content_text.py"
      - "Project_Mia/backend/scripts/export_exam_images.py"
      - "Project_Mia/scripts/quality_check.py"
      - ".github/workflows/export-static-content.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import curated exam bundles
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(Project_Mia/backend/data_import/*.json)
          if (( ${#bundles[@]} == 0 )); then
            echo "No curated exam bundles found."
          else
            for bundle in "${bundles[@]}"; do
              python Project_Mia/backend/scripts/import_exam_bundle.py "${bundle}"
            done
          fi

      - name: Apply deterministic legacy repairs
        run: python Project_Mia/backend/scripts/repair_exam_content.py

      - name: Normalize catalog storage and remove committed test fixtures
        run: python Project_Mia/backend/scripts/normalize_exam_storage.py

      - name: Validate English I catalog structure and answers
        run: python Project_Mia/backend/scripts/validate_exam_catalog.py

      - name: Run legacy answer completeness audit
        run: python Project_Mia/scripts/quality_check.py

      - name: Export SQLite content
        run: python Project_Mia/backend/scripts/export_static_content_text.py

      - name: Export question images into Markdown projection
        run: python Project_Mia/backend/scripts/export_exam_images.py

      - name: Commit database and generated text projection
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Project_Mia/backend/data/static_content.db Project_Mia/backend/data_export)" ]; then
            echo "Database and generated export are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project_Mia/backend/data/static_content.db Project_Mia/backend/data_export
          git commit -m "Repair exams and regenerate static export"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
